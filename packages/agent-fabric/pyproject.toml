[project]
name = "spec-agents-core"
description = "Spec-driven pipelines and hierarchical agents (PydanticAI, DSPy, CrewAI, LangChain) over a LiteLLM proxy"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marcio Nicolau" }]
keywords = ["agents", "llm", "pipelines", "pydantic", "specs"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "pyyaml>=6.0.2",
  "rich>=13.7.1",
]
dynamic = ["version"]

[project.urls]
Changelog = "https://github.com/marcionicolau/spec-agents/blob/main/packages/agent-fabric/CHANGELOG.md"
Documentation = "https://github.com/marcionicolau/spec-agents/tree/main/docs"
Homepage = "https://github.com/marcionicolau/spec-agents"
Issues = "https://github.com/marcionicolau/spec-agents/issues"
Repository = "https://github.com/marcionicolau/spec-agents"

[project.scripts]
agent-fabric = "agent_fabric.cli:main"

[project.optional-dependencies]
all = ["spec-agents-core[tabular,pydantic-ai,dspy,crewai,langchain,otel]"]
crewai = ["crewai>=0.100"]
dspy = ["dspy>=3.0"]
langchain = ["langchain-core>=0.3"]
otel = ["opentelemetry-sdk>=1.30"]
proxy = ["litellm[proxy]>=1.60"]
pydantic-ai = ["pydantic-ai-slim[openai]>=1.0"]
tabular = ["pandas>=2.1"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.14"]
build-backend = "hatchling.build"

# version = latest "agent-fabric-vX.Y.Z" git tag (other packages' tags are ignored); untagged commits get X.Y.(Z+1).devN+<sha>
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_fabric"]

[tool.uv]
package = true

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
pattern-prefix = "agent-fabric-"
fallback-version = "0.0.0"
