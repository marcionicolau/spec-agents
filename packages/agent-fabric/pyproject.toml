[project]
name = "agent-fabric"
dynamic = ["version"]
description = "Spec-driven pipelines and hierarchical agents (PydanticAI, DSPy, CrewAI, LangChain) over a LiteLLM proxy"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "pyyaml>=6",
  "rich>=13.7.1",
]

[project.scripts]
agent-fabric = "agent_fabric.cli:main"

[project.optional-dependencies]
all = ["agent-fabric[tabular,pydantic-ai,dspy,crewai,langchain]"]
crewai = ["crewai>=0.100"]
dspy = ["dspy>=3.0"]
langchain = ["langchain-core>=0.3"]
proxy = ["litellm[proxy]>=1.60"]
pydantic-ai = ["pydantic-ai-slim[openai]>=1.0"]
tabular = ["pandas>=2.1"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.14"]
build-backend = "hatchling.build"

[tool.uv]
package = true

# version = latest "agent-fabric-vX.Y.Z" git tag (other packages' tags are ignored); untagged commits get X.Y.(Z+1).devN+<sha>
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_fabric"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
pattern-prefix = "agent-fabric-"
fallback-version = "0.0.0"
