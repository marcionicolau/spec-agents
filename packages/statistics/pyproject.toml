[project]
name = "statistics"
dynamic = ["version"]
description = "Statistics domain pack for agent-fabric: summary, linear_model, anova, time_series, pca, clustering"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Marcio Nicolau" }]
keywords = ["statistics", "agents", "pandas"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "agent-fabric>=0.0.1,<1",
  "pandas>=2.1",
  "scipy>=1.12",
  "statsmodels>=0.14.2",
  "scikit-learn>=1.4",
]

[project.entry-points."agent_fabric.domains"]
statistics = "stat_fabric.domain:register"

[project.urls]
Homepage = "https://github.com/marcionicolau/spec-agents"
Repository = "https://github.com/marcionicolau/spec-agents"
Issues = "https://github.com/marcionicolau/spec-agents/issues"
Changelog = "https://github.com/marcionicolau/spec-agents/blob/main/packages/statistics/CHANGELOG.md"
Documentation = "https://github.com/marcionicolau/spec-agents/tree/main/docs"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.14"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.uv.sources]
agent-fabric = { workspace = true }

# version = latest "statistics-vX.Y.Z" git tag (other packages' tags are ignored); untagged commits get X.Y.(Z+1).devN+<sha>
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/stat_fabric"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
pattern-prefix = "statistics-"
fallback-version = "0.0.0"
