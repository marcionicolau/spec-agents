[project]
name = "coworker"
version = "0.2.0"
description = "Coworker domain pack for agent-fabric: repo_index, context_select, context_pack, code_review, patch_propose"
requires-python = ">=3.12"
dependencies = [
  "agent-fabric",
]

[project.entry-points."agent_fabric.domains"]
coworker = "coworker_fabric.domain:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coworker_fabric = ["skills/**/*.md"]

[tool.uv]
package = true

[tool.uv.sources]
agent-fabric = { workspace = true }

[tool.semantic_release]
version_toml = ["packages/coworker/pyproject.toml:project.version"]
tag_format = "coworker-v{version}"
commit_scope = "coworker"
changelog_file = "packages/coworker/CHANGELOG.md"
build_command = ""
