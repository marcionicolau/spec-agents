[project]
name = "coworker"
version = "1.0.0"
description = "Coworker domain pack for agent-fabric: repo_index, context_select, context_pack, code_review, patch_propose"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "agent-fabric>=0.2,<1",
]

[project.entry-points."agent_fabric.domains"]
coworker = "coworker_fabric.domain:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coworker_fabric = ["skills/**/*.md"]

[tool.uv]
package = true

[tool.uv.sources]
agent-fabric = { workspace = true }
