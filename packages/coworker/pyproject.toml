[project]
name = "coworker"
dynamic = ["version"]
description = "Coworker domain pack for agent-fabric: repo_index, context_select, context_pack, code_review, patch_propose"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "agent-fabric>=0.0.1,<1",
]

[project.entry-points."agent_fabric.domains"]
coworker = "coworker_fabric.domain:register"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.14"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.uv.sources]
agent-fabric = { workspace = true }

# version = latest "coworker-vX.Y.Z" git tag (other packages' tags are ignored); untagged commits get X.Y.(Z+1).devN+<sha>
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/coworker_fabric"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
pattern-prefix = "coworker-"
fallback-version = "0.0.0"
