[project]
name = "spec-agents-workspace"
version = "0.0.0"
description = "Metarepo: agent-fabric core + domain plugin packs (statistics, lakehouse, coworker)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "mkdocs-gen-files>=0.6.1",
  "mkdocs-material>=9.7.7",
  "mkdocstrings-python>=2.0.9",
  "pytest>=8",
  "pytest-cov>=7.1.0",
  "ruff>=0.5",
  "ty==0.0.84",
]

[tool.coverage.run]
source = ["packages"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = false
skip_covered = true

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
testpaths = ["tests", "packages"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "UP", "E", "I", "B", "SIM", "RUF", "PT", "D"]
# E501: line length is left to the formatter; the others are style-only and noisy in this codebase
# D101-D107 (undocumented-*): docstring *existence* on public names is enforced by tests/test_public_api.py
# (ratchet in tests/public_api_undocumented.txt); internal names need no docstring. D rules here govern style.
ignore = ["E501", "PT018", "RUF005", "RUF012", "B905", "D101", "D102", "D103", "D105", "D107"]

# docstrings on the public API follow the Google convention (issue #86)
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["E731", "PT006", "PT011", "B017", "RUF015", "D"]
"examples/*" = ["D"]
"tools/*" = ["D"]
"docs/*" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["agent_fabric", "stat_fabric", "lake_fabric", "coworker_fabric", "text_pack", "examples", "tests"]

# ty is pre-1.0 (pinned in the dev group). All five packages are checked.
[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = [
  "packages/agent-fabric/src",
  "packages/coworker/src",
  "packages/lakehouse/src",
  "packages/statistics/src",
  "packages/text-pack/src",
]

[[tool.ty.overrides]]
# dspy is an optional, dynamically typed dependency imported behind `try/except ImportError` (`dspy = None` fallback)
include = ["packages/agent-fabric/src/agent_fabric/integrations/dspy.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
call-non-callable = "ignore"
invalid-argument-type = "ignore"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]
