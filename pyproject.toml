[project]
name = "spec-agents"
version = "0.0.0"
description = "Metarepo: agent-fabric core + domain plugin packs (statistics, lakehouse, coworker)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.5",
    "ty==0.0.84",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
testpaths = ["tests", "packages"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "UP", "E", "I", "B", "SIM", "RUF", "PT"]
# E501: line length is left to the formatter; the others are style-only and noisy in this codebase
ignore = ["E501", "PT018", "RUF005", "RUF012", "B905"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["E731", "PT006", "PT011", "B017", "RUF015"]

[tool.ruff.lint.isort]
known-first-party = ["agent_fabric", "stat_fabric", "lake_fabric", "coworker_fabric", "text_pack", "examples", "tests"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.coverage.run]
source = ["packages"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = false
skip_covered = true

# ty is pre-1.0 (pinned in the dev group). Scope grows package by package; start with the core.
[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["packages/agent-fabric/src"]

[[tool.ty.overrides]]
# dspy is an optional, dynamically typed dependency imported behind `try/except ImportError` (`dspy = None` fallback)
include = ["packages/agent-fabric/src/agent_fabric/integrations/dspy.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
call-non-callable = "ignore"
invalid-argument-type = "ignore"
