[project]
name = "spec-agents"
version = "0.0.0"
description = "Metarepo: agent-fabric core + domain plugin packs (statistics, lakehouse, coworker)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "UP"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]
