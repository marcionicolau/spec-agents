name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # which packages need their tests run; core / workspace-wide changes fan out to every package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packages: ${{ steps.matrix.outputs.packages }}
      core: ${{ steps.matrix.outputs.core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # version comes from git tags
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            core:
              - 'packages/agent-fabric/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'justfile'
              - '.github/workflows/ci.yml'
            statistics: ['packages/statistics/**']
            lakehouse: ['packages/lakehouse/**']
            coworker: ['packages/coworker/**']
            text-pack: ['packages/text-pack/**', 'examples/**']
      - id: matrix
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          core=$(jq -r 'index("core") != null' <<<"$CHANGED")
          if [ "$core" = "true" ]; then
            pkgs='["agent-fabric","statistics","lakehouse","coworker","text-pack"]'
          else
            pkgs=$(jq -c '. - ["core"]' <<<"$CHANGED")
          fi
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"
          echo "packages to test: $pkgs"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # version comes from git tags
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - run: just sync
      - name: Ruff (check + format)
        run: just lint
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      - name: Workflow security audit (zizmor)
        run: uvx zizmor@1.30.1 --no-progress .github

  specs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # version comes from git tags
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - run: just sync
      - name: Lint spec trees and CLI smoke
        run: just specs
      - name: Planner baseline (informational)
        # the rules baseline intentionally fails treatment_effect (docs/maintenance.md); live evals need the proxy
        run: just evals rules
        continue-on-error: true

  test:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
        python: ["3.12", "3.13"]
    name: test (${{ matrix.package }}, ${{ matrix.python }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # version comes from git tags
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - run: just sync
      - run: just test "$PACKAGE"
        env:
          PACKAGE: ${{ matrix.package }}

  extras:
    # every optional framework installed: the adapter tests must run (no skips) and coverage is enforced
    needs: changes
    if: needs.changes.outputs.core == 'true' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # version comes from git tags
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - run: just sync --all-extras
      - name: Type check (ty, optional frameworks resolved)
        run: uv run ty check
      - name: Full suite with coverage, no skipped tests
        run: |
          uv run pytest -q -rs --cov --cov-report=term | tee pytest.log
          if grep -q "^SKIPPED" pytest.log; then echo "::error::tests were skipped with all extras installed"; exit 1; fi

  lowest:
    # the floors declared in pyproject.toml must actually work (lowest versions that satisfy them, oldest Python)
    needs: changes
    if: needs.changes.outputs.core == 'true' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # version comes from git tags
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.12" # oldest supported; older floors have no wheels for newer Pythons
          enable-cache: true
      - run: uv sync --resolution lowest-direct --all-packages --group dev
      - run: uv run --no-sync pytest -q # --no-sync: `uv run` would re-resolve to the highest versions

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # version comes from git tags
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - run: just sync
      - name: Build wheels/sdists and verify skills + LICENSE are shipped
        run: just build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  ci-ok:
    # the only status check branch protection needs to require
    if: always()
    needs: [changes, lint, specs, test, extras, build, lowest]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All required jobs passed (skipped is fine, failed/cancelled is not)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e '[.[].result] | any(. == "failure" or . == "cancelled")' >/dev/null; then exit 1; fi
