name: labeler

# pull_request_target so fork PRs can be labeled; this workflow never checks out or runs PR code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  paths:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  issue-package:
    # issue forms cannot map a dropdown to a label: read the "Package" answer and apply pkg:<value>
    if: github.event_name == 'issues'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        with:
          script: |
            const body = process.env.ISSUE_BODY || "";
            const m = body.match(/###\s+Package\s*\n+\s*([^\n]+)/i);
            if (!m) return;
            const value = m[1].trim();
            if (!/^[a-z0-9-]+$/.test(value)) return;
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, labels: [`pkg:${value}`],
            });
