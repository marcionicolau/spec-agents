name: labeler

# plain pull_request (not pull_request_target): same-repo PRs are labeled; fork PRs get no labels but also no privileged token.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened]

permissions: {}

jobs:
  paths:
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  issue-package:
    permissions:
      issues: write
    # issue forms cannot map a dropdown to a label: read the "Package" answer and apply pkg:<value>
    if: github.event_name == 'issues'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        with:
          script: |
            const body = process.env.ISSUE_BODY || "";
            const m = body.match(/###\s+Package\s*\n+\s*([^\n]+)/i);
            if (!m) return;
            const value = m[1].trim();
            if (!/^[a-z0-9-]+$/.test(value)) return;
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, labels: [`pkg:${value}`],
            });
