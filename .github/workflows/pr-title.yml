name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # PR titles become the squash-commit message that release-please reads; a wrong scope means no release.
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scopes: |
            agent-fabric
            statistics
            lakehouse
            coworker
            ci
            deps
            docs
          requireScope: false
