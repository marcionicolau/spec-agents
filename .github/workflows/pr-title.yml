name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # `main` is the scope release-please uses (chore(main): release <pkg> <version>).
      # PR titles become the squash-commit message that release-please reads; a wrong scope means no release.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scopes: |
            agent-fabric
            statistics
            lakehouse
            coworker
            ci
            deps
            docs
            text-pack
            main
          requireScope: false
