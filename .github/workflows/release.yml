name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# needs contents:write to push the version-bump commit and the <package>-v* tag
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [agent-fabric, statistics, lakehouse, coworker]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0 # semantic-release needs full history to diff tags
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Release ${{ matrix.package }}
        # conventional commits scoped to the package name drive bumps; no-op when
        # nothing matching since the last <package>-v* tag
        run: >-
          uvx python-semantic-release
          --config packages/${{ matrix.package }}/pyproject.toml
          version --commit --tag --push --skip-build
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
