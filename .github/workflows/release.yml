name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    # Re-publish the wheel and sdist of an existing GitHub Release to PyPI/TestPyPI (retry, or publish releases made before PyPI was set up).
    # Runs in this file because PyPI trusted publishers are bound to the workflow file name.
    inputs:
      tag:
        description: "Release tag, e.g. statistics-v0.2.1 or agent-fabric-v0.5.1"
        required: true
        type: string
      index:
        description: "Target index"
        required: true
        type: choice
        options: [testpypi, pypi]
        default: testpypi

# release-please opens/updates one release PR per package; merging it tags and creates the GitHub Release.
# Use a PAT or GitHub App token (RELEASE_PLEASE_TOKEN) if the release PR must trigger CI; GITHUB_TOKEN-created
# PRs do not start other workflows.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # tags and GitHub Releases
      pull-requests: write # release PRs
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      paths_released: ${{ steps.rp.outputs.paths_released }}
      tags: ${{ toJSON(steps.rp.outputs) }}
      publish_matrix: ${{ steps.matrix.outputs.publish_matrix }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - id: matrix
        # one PyPI environment per package: a pending trusted publisher must be unique per (repo, workflow, environment)
        env:
          PATHS: ${{ steps.rp.outputs.paths_released || '[]' }}
        run: |
          matrix=$(jq -c 'map({pkg: (. | sub("^packages/"; "")), environment: ("pypi-" + (. | sub("^packages/"; "")))})' <<<"$PATHS")
          echo "publish_matrix=$matrix" >> "$GITHUB_OUTPUT"

  assets:
    # Build each released package at its tag and attach wheel + sdist to its GitHub Release. Packages are not published to an index
    # (see docs/releasing.md); the GitHub Release is the distribution for now.
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    permissions:
      contents: write # upload assets to the release
    steps:
      - name: Resolve package and tag
        id: pkg
        env:
          RP_OUTPUTS: ${{ needs.release-please.outputs.tags }}
          RELEASE_PATH: ${{ matrix.path }}
        run: |
          pkg="${RELEASE_PATH#packages/}"
          tag=$(jq -r --arg k "${RELEASE_PATH}--tag_name" '.[$k] // empty' <<<"$RP_OUTPUTS")
          if [ -z "$tag" ] || [[ ! "$pkg" =~ ^[a-z0-9-]+$ ]]; then echo "::error::no tag or invalid package for $RELEASE_PATH"; exit 1; fi
          {
            echo "pkg=$pkg"
            echo "tag=$tag"
            echo "version=${tag##*-v}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pkg.outputs.tag }}
          fetch-depth: 0 # version comes from git tags
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
      - name: Build and verify
        env:
          PKG: ${{ steps.pkg.outputs.pkg }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          # the distribution name (PyPI name) comes from the package's pyproject, not from its directory
          DIST=$(python3 -c "import sys, tomllib; print(tomllib.load(open(f'packages/{sys.argv[1]}/pyproject.toml', 'rb'))['project']['name'])" "$PKG")
          uv build --package "$DIST" --out-dir dist
          uv run --no-project python tools/check_wheels.py dist --expect-version "$VERSION"
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ steps.pkg.outputs.pkg }}
          path: dist/
          retention-days: 7
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pkg.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  sync-release-prs:
    # Merging one release PR changes the shared manifest and makes the other open release PRs conflict: rebuild those branches on main.
    # Needs the PAT (RELEASE_PLEASE_TOKEN): pushes made with GITHUB_TOKEN would not start CI, and the required checks must re-run.
    needs: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rebuild conflicting release PR branches
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 tools/release_sync.py --repo "$REPO"

  publish:
    # Publish the verified wheel + sdist of each released package to PyPI with trusted publishing (OIDC, no stored token).
    # Off until the repository variable PYPI_PUBLISH is 'true' (set it after the pending publishers exist on PyPI; the per-package
    # environments pypi-<package> are created by the repository setup). Set PYPI_REPOSITORY_URL to https://test.pypi.org/legacy/ to rehearse on TestPyPI.
    needs: [release-please, assets]
    if: needs.release-please.outputs.releases_created == 'true' && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-please.outputs.publish_matrix) }}
    environment:
      name: ${{ matrix.environment }}
    permissions:
      id-token: write # trusted publishing
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ matrix.pkg }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          repository-url: ${{ vars.PYPI_REPOSITORY_URL || 'https://upload.pypi.org/legacy/' }}

  plan-republish:
    # manual run: validate the tag and work out the package, its PyPI environment and the target index
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      pkg: ${{ steps.plan.outputs.pkg }}
      environment: ${{ steps.plan.outputs.environment }}
      version: ${{ steps.plan.outputs.version }}
      repository_url: ${{ steps.plan.outputs.repository_url }}
    steps:
      - id: plan
        env:
          TAG: ${{ inputs.tag }}
          INDEX: ${{ inputs.index }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! "$TAG" =~ ^(agent-fabric|statistics|lakehouse|coworker|text-pack)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::'$TAG' is not a release tag of this repository (<package>-vX.Y.Z)"; exit 1
          fi
          pkg="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null || { echo "::error::no GitHub Release for $TAG"; exit 1; }
          case "$INDEX" in
            pypi) url="https://upload.pypi.org/legacy/" ;;
            testpypi) url="https://test.pypi.org/legacy/" ;;
            *) echo "::error::unknown index $INDEX"; exit 1 ;;
          esac
          {
            echo "pkg=$pkg"
            echo "environment=pypi-$pkg"
            echo "version=$version"
            echo "repository_url=$url"
          } >> "$GITHUB_OUTPUT"

  publish-existing:
    needs: plan-republish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ${{ needs.plan-republish.outputs.environment }}
    permissions:
      id-token: write # trusted publishing
      contents: read # download the release assets
    steps:
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.plan-republish.outputs.version }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.whl' --pattern '*.tar.gz'
          ls -l dist
          # only spec_agents_* distributions of exactly this version, one wheel and one sdist
          shopt -s nullglob
          files=(dist/*)
          if [ "${#files[@]}" -ne 2 ]; then echo "::error::expected one wheel and one sdist, found ${#files[@]} file(s)"; exit 1; fi
          for f in "${files[@]}"; do
            [[ "$(basename "$f")" == spec_agents_*-"$VERSION"* ]] || { echo "::error::$f is not a spec_agents_* build of $VERSION (releases made before the rename carry the old names and cannot be published)"; exit 1; }
          done
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          repository-url: ${{ needs.plan-republish.outputs.repository_url }}
          skip-existing: true # idempotent retry

