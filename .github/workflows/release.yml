name: release

on:
  push:
    branches: [main]

# release-please opens/updates one release PR per package; merging it tags and creates the GitHub Release.
# Use a PAT or GitHub App token (RELEASE_PLEASE_TOKEN) if the release PR must trigger CI; GITHUB_TOKEN-created
# PRs do not start other workflows.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
